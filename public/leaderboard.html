<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPoint - Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">Quiz<span>Point</span></a>
      <div class="nav-links">
        <a href="index.html">Quizzes</a>
        <a href="subjects.html">Subjects</a>
        <a href="create.html" id="nav-create">Create Quiz</a>
        <span id="nav-user" class="nav-user"></span>
        <a href="#" id="logout-link">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-head">
      <h1 id="title">Leaderboard</h1>
      <p class="subtitle" id="subtitle">Top 10 scores. Ties go to whoever finished first.</p>
    </div>

    <div id="alert" class="alert alert-error"></div>

    <div class="card">
      <div id="board" class="table-wrap"><p class="meta">Loading...</p></div>
    </div>

    <div class="form-actions" style="justify-content:flex-start">
      <a class="btn btn-outline" href="index.html">Back to quizzes</a>
      <a class="btn hidden" id="take-link" href="#">Take this quiz</a>
      <a class="btn btn-outline hidden" id="key-link" href="#">Answer key</a>
    </div>
  </main>

  <script>
    // ---------- Login check (same block on every page) ----------
    const token = localStorage.getItem('qp_token');
    const me = JSON.parse(localStorage.getItem('qp_user') || 'null');
    if (!token || !me) {
      location.replace('login.html');
      throw new Error('Not logged in');
    }
    const isTeacher = me.role === 'teacher';
    document.getElementById('nav-user').textContent = me.name + (isTeacher ? ' (Teacher)' : '');
    // Only teachers see the "Create Quiz" link
    if (!isTeacher) document.getElementById('nav-create').classList.add('hidden');

    // fetch() that always sends the token, and goes to login if the session has ended
    async function api(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), Authorization: 'Bearer ' + token }
      });
      if (res.status === 401) {
        localStorage.removeItem('qp_token');
        localStorage.removeItem('qp_user');
        location.replace('login.html');
        throw new Error('Please log in again');
      }
      return res;
    }

    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      try { await api('/api/logout', { method: 'POST' }); } catch (err) { /* logging out anyway */ }
      localStorage.removeItem('qp_token');
      localStorage.removeItem('qp_user');
      location.replace('login.html');
    });
    // ---------- End of login check ----------

    const quizId = new URLSearchParams(window.location.search).get('id');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const board = document.getElementById('board');
    const alertBox = document.getElementById('alert');
    const takeLink = document.getElementById('take-link');
    const keyLink = document.getElementById('key-link');

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function showError(message) {
      alertBox.innerHTML = message;
      alertBox.classList.add('show');
      board.innerHTML = '';
    }

    async function loadLeaderboard() {
      if (!quizId) {
        showError('No quiz selected. Go back to <a href="index.html">your quizzes</a>.');
        return;
      }

      try {
        // The quiz details tell us whether to show "Take this quiz"
        const [boardRes, quizRes] = await Promise.all([
          api('/api/quizzes/' + encodeURIComponent(quizId) + '/leaderboard'),
          api('/api/quizzes/' + encodeURIComponent(quizId))
        ]);
        const data = await boardRes.json();
        const quiz = await quizRes.json();
        if (!boardRes.ok) throw new Error(data.error || 'Could not load leaderboard');

        titleEl.textContent = 'Leaderboard: ' + data.title;
        if (data.subjectName) subtitleEl.textContent = data.subjectName + ' · Top 10 scores. Ties go to whoever finished first.';

        if (isTeacher) {
          keyLink.href = 'review.html?id=' + encodeURIComponent(quizId);
          keyLink.classList.remove('hidden');
        } else if (quizRes.ok && quiz.status === 'ongoing' && (!quiz.myAttempt || quiz.myAttempt.state === 'in-progress')) {
          takeLink.href = 'take.html?id=' + encodeURIComponent(quizId);
          takeLink.textContent = quiz.myAttempt ? 'Resume this quiz' : 'Take this quiz';
          takeLink.classList.remove('hidden');
        }

        if (data.leaderboard.length === 0) {
          board.innerHTML = '<p class="empty" style="padding:20px">No one has submitted this quiz yet.</p>';
          return;
        }

        board.innerHTML = `
          <table>
            <thead>
              <tr><th>Rank</th><th>Name</th><th>USN</th><th>Score</th><th>Percent</th><th>Submitted</th></tr>
            </thead>
            <tbody>
              ${data.leaderboard.map((row, i) => `
                <tr class="${i === 0 ? 'top-row' : ''} ${row.usn === me.usn ? 'me-row' : ''}">
                  <td>${i + 1}</td>
                  <td>${escapeHtml(row.name || '-')}${i === 0 ? '<span class="badge">Topper</span>' : ''}${row.usn === me.usn ? ' (you)' : ''}</td>
                  <td>${escapeHtml(row.usn)}</td>
                  <td>${row.score} / ${row.total}</td>
                  <td>${Math.round((row.score / row.total) * 100)}%</td>
                  <td>${row.takenAt ? new Date(row.takenAt).toLocaleString() : '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        showError(err.message === 'Failed to fetch' ? 'Cannot reach the server. Is node server.js running?' : escapeHtml(err.message));
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
