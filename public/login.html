<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPoint - Log in</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Password boxes look the same as the text boxes in style.css */
    input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px #dbeafe;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="login.html">Quiz<span>Point</span></a>
    </div>
  </nav>

  <main class="container" style="max-width:440px">
    <div class="page-head">
      <h1>Log in</h1>
      <p class="subtitle">Use your RVCE email id.</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="login-form" class="card" novalidate>
      <div class="form-group">
        <label for="email">College email *</label>
        <input type="text" id="email" placeholder="yourname@rvce.edu.in" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button type="submit" id="submit-btn" class="btn" style="width:100%">Log in</button>
      <p class="hint" style="text-align:center;margin-top:14px">
        New here? <a href="register.html">Create an account</a>
      </p>
    </form>
  </main>

  <script>
    // Already logged in? Go straight to the quizzes.
    if (localStorage.getItem('qp_token')) {
      location.replace('index.html');
    }

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(message, type) {
      alertBox.className = 'alert show ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBox.textContent = message;
    }

    // Coming from the register page? Show a friendly message and fill the email.
    const params = new URLSearchParams(location.search);
    if (params.get('registered')) {
      showAlert('Account created. Log in to continue.', 'success');
      emailInput.value = params.get('email') || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) return showAlert('Please enter your email and password.', 'error');
      if (!email.endsWith('@rvce.edu.in')) return showAlert('Only @rvce.edu.in email ids can log in.', 'error');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not log in');

        // Keep the token so every page can send it to the server
        localStorage.setItem('qp_token', data.token);
        localStorage.setItem('qp_user', JSON.stringify(data.user));
        location.replace('index.html');
      } catch (err) {
        showAlert(err.message === 'Failed to fetch' ? 'Cannot reach the server. Is node server.js running?' : err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
